[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent-workflow"
version = "0.1.0"
description = "A verifiable literature and data driven academic paper workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GitHub Copilot Task Agent" }]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
include = ["paper_agent*"]
